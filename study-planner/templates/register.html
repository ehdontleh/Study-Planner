{% extends "base.html" %}
{% block title %}Create account — Study Planner{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h1>Create your account</h1>
    <p class="muted" style="margin-bottom:20px;">Your subjects, tasks, and progress stay private to you.</p>
    <form method="POST" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        <span class="muted">At least 8 characters.</span>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
    <p class="muted" style="margin-top:16px;">
      Already have one? <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
