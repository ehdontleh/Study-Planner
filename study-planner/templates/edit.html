{% extends "base.html" %}
{% block title %}Edit task — Study Planner{% endblock %}
{% block content %}
<div class="shell">
  <div class="page-head">
    <div class="eyebrow">Editing</div>
    <h1>{{ task.title }}</h1>
  </div>

  <div class="card" style="max-width:560px;">
    <form method="POST" action="{{ url_for('edit_task') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="task_id" value="{{ task.id }}">

      <div class="field">
        <label>Title</label>
        <input type="text" name="title" value="{{ task.title }}" required>
      </div>
      <div class="field">
        <label>Description</label>
        <textarea name="description" rows="3">{{ task.description or '' }}</textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Estimated minutes</label>
          <input type="number" name="estimated_minutes" min="1" value="{{ task.estimated_minutes }}" required>
        </div>
        <div class="field">
          <label>Priority</label>
          <select name="priority">
            <option value="1" {{ 'selected' if task.priority == 1 }}>Low</option>
            <option value="2" {{ 'selected' if task.priority == 2 }}>Medium</option>
            <option value="3" {{ 'selected' if task.priority == 3 }}>High</option>
          </select>
        </div>
        <div class="field">
          <label>Difficulty</label>
          <select name="difficulty">
            <option value="Easy" {{ 'selected' if task.difficulty == 'Easy' }}>Easy</option>
            <option value="Medium" {{ 'selected' if task.difficulty == 'Medium' }}>Medium</option>
            <option value="Hard" {{ 'selected' if task.difficulty == 'Hard' }}>Hard</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Deadline</label>
          <input type="date" name="deadline" value="{{ task.deadline or '' }}">
        </div>
        <div class="field">
          <label>Resource URL</label>
          <input type="url" name="resource_url" value="{{ task.resource_url or '' }}">
        </div>
      </div>

      <div class="btn-row" style="margin-top:6px;">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{{ url_for('index') }}" class="btn">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
